# This runs jobs which pyiron modules should run on pushes or PRs to main

name: Push-Pull

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pyiron:
    uses: pyiron/actions/.github/workflows/push-pull.yml@actions-4.2.1
    secrets: inherit
    with:
      do-coveralls: false
      do-codecov: true
      # The main leg (all runners) is 3.12; the alternates run on the main
      # runner only. Together they cover requires-python (3.12-3.14).
      python-version: '3.12'
      python-version-alt1: '3.13'
      python-version-alt2: '3.14'
      python-version-alt3: 'exclude'
      # conda-forge lammps has no Windows build; drop windows from the runner
      # matrix so the conda solve doesn't kill the run.
      # (runner-alt1 = windows-latest; runner-alt2 = macos-latest, kept.)
      runner-alt1: 'exclude'
      # Lower-bound leg: solve .ci_support/lower-bound.yml (the floors the
      # release publishes) on the oldest supported python and run the unit
      # tests there, so a source change needing something newer than a floor
      # fails CI. tests/unit is unittest-collectable; LAMMPS is not in that
      # env, so the tests that run `lmp` skip.
      alternate-tests-env-files: .ci_support/lower-bound.yml
      alternate-tests-python-version: '3.12'
      alternate-tests-dir: tests/unit
      # The notebook plots with matplotlib, which is not a package dependency;
      # this env file adds it (also merged into .binder/environment.yml by
      # commit-updated-env).
      notebooks-env-files: .ci_support/environment.yml .ci_support/environment-notebooks.yml
      # Execute notebooks from their own directory, as Jupyter/Binder do, so
      # they can find the potential file bundled next to them.
      notebooks-working-directory: notebooks
