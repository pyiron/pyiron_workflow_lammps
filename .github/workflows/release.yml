name: Release

on:
  # PRs run the dependency rewrite + build as a preview; only a published
  # release uploads to PyPI (publish-to-pypi below).
  pull_request:
  release:
    types: [ published ]

jobs:
  pyiron:
    uses: ./.github/workflows/pyproject-release.yml
    secrets: inherit
    with:
      # 0.x deps get explicit caps from upper-bound.yml; with the default
      # always-pin-unstable they would otherwise be published as exact == pins.
      semantic-upper-bound: 'minor'
      lower-bound-yaml: '.ci_support/lower-bound.yml'
      upper-bound-yaml: '.ci_support/upper-bound.yml'
      pypi-to-conda-name-map-file: '.github/actions/.support/pypi_vs_conda_names.json'
      publish-to-pypi: ${{ github.event_name == 'release' && github.event.action == 'published' }}
