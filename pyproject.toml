[build-system]
requires = [
    # >=77 for the PEP 639 SPDX `license` string below.
    "setuptools>=77",
    "versioneer[toml]==0.29",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyiron_workflow_lammps"
dynamic = ["version"]
description = "A LAMMPS workflow integration package for pyiron"
readme = "README.md"
keywords = ["pyiron", "lammps", "workflow", "molecular-dynamics", "materials-science"]
requires-python = ">=3.11, <3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "pyiron Team", email = "pyiron@mpie.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Strict ==-pins match .ci_support/environment.yml. The release workflow
    # (.github/workflows/release.yml) rewrites these to >=lower,<upper ranges
    # before publishing: floors come from .ci_support/lower-bound.yml, caps
    # from .ci_support/upper-bound.yml (every 0.x dep, which would otherwise be
    # pinned exactly) or else the next minor version. Spellings matter to that
    # rewrite: names are mapped through
    # .github/actions/.support/pypi_vs_conda_names.json before the lookup.
    # Only directly imported packages are listed; pyiron_workflow is the
    # runtime that executes the flowrep nodes defined here.
    "ase==3.29.0",
    "flowrep==0.6.7",
    "lammpsparser==0.0.10",
    "numpy==2.4.6",
    "pyiron_snippets==1.5.0",
    "pyiron-workflow==0.20.3",
    "pyiron-workflow-atomistics==0.3.0",
    "pymatgen==2026.9.24",
]

[project.urls]
Homepage = "https://github.com/pyiron/pyiron_workflow_lammps"
Documentation = "https://github.com/pyiron/pyiron_workflow_lammps"
Repository = "https://github.com/pyiron/pyiron_workflow_lammps"
"Bug Tracker" = "https://github.com/pyiron/pyiron_workflow_lammps/issues"

[project.optional-dependencies]
# Extras are not touched by the release rewrite, so they are written as
# finished ranges.
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "isort>=5.0",
    "ruff>=0.5",
]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
]

[tool.versioneer]
VCS = "git"
style = "pep440-pre"
versionfile_source = "pyiron_workflow_lammps/_version.py"
versionfile_build = "pyiron_workflow_lammps/_version.py"
parentdir_prefix = "pyiron_workflow_lammps-"
tag_prefix = "pyiron_workflow_lammps-"

[tool.setuptools.packages.find]
include = ["pyiron_workflow_lammps*"]

[tool.ruff]
exclude = ["docs", "notebooks", "setup.py", "_version.py", ".github"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "C4",  # flake8-comprehensions
    "ERA", # eradicate
    "PL",  # pylint
]
ignore = [
    "E501",     # line length
    "PLR0913",  # too many args
    "PLR0917",  # too many positional args (node signatures are keyword-wired)
    "PLR2004",  # magic values
    "PLC0414",  # import alias does not rename
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0911",  # too many returns
]

[tool.ruff.lint.per-file-ignores]
"pyiron_workflow_lammps/__init__.py" = ["F401"]
# Pre-existing patterns in modules carried over from before the Engine
# Protocol migration. Lint them in-place rather than rewriting moved code:
#   B028 — warnings.warn without explicit stacklevel
#   ERA001 — commented-out code (mostly debug prints)
#   PLC0415 — non-top-level imports (intentional for circular-import avoidance)
#   B006 — mutable default args (in helper signatures, behavior-preserving)
#   PLR0915, PLR0912 — long function bodies (parse_LammpsOutput etc.)
"pyiron_workflow_lammps/engine.py" = ["B028", "ERA001", "PLC0415"]
"pyiron_workflow_lammps/generic.py" = ["B006", "ERA001", "PLC0415"]
"pyiron_workflow_lammps/lammps.py" = ["B028", "ERA001", "PLC0415", "B006", "PLR0915", "PLR0912", "B007", "SIM108", "SIM102", "B904", "F841"]
# Pre-existing test debris (commented-out experiments, lazy imports for
# heavy deps, lambda-as-var, blind pytest.raises(Exception), unused locals
# in expectation-only assertions, etc.).
"tests/**" = ["ERA001", "PLC0415", "E731", "B017", "F841", "B007"]

[tool.black]
extend-exclude = '''
(
  ^/docs
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
# Mirrors tests/conftest.py, which registers the same markers in code so a
# copy of tests/ run against an installed wheel knows them too.
markers = [
    "integration: runs a real LAMMPS binary ('lmp' on PATH, or the LAMMPS_COMMAND environment variable); skipped when none is found",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Only escalate SyntaxWarnings from this package: third-party modules compiled
# fresh in a new env would otherwise turn into collection errors.
# Compile-time warnings carry the source *path* (minus .py) as their module,
# hence a path regex rather than a dotted name.
filterwarnings = ['error::SyntaxWarning:.*pyiron_workflow_lammps[/\\]\w+\Z']

[tool.mypy]
exclude = [
    "^docs/conf\\.py$",
    "^tests/",
]
ignore_missing_imports = true
strict_equality = true
