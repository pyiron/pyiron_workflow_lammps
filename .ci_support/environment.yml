# CI environment: the == pins of pyproject.toml's [project].dependencies under
# their conda-forge names, plus the LAMMPS binary and the test runner.
# Solves on linux-64, osx-64 and osx-arm64 for python 3.11-3.14.
channels:
  - conda-forge

dependencies:
  - python>=3.11,<3.15
  - pip
  # >=77 for the PEP 639 license string; CI builds with --no-build-isolation
  - setuptools >=77
  - ase =3.29.0
  - flowrep =0.6.7
  - lammpsparser =0.0.10
  - numpy =2.4.6
  - pyiron_snippets =1.5.0
  - pyiron_workflow =0.20.3
  # conda-forge spells this one with hyphens (unlike pyiron_workflow); the
  # dependabot env updater matches the PyPI name, so keep the hyphens.
  - pyiron-workflow-atomistics =0.3.0
  - pymatgen =2026.9.24
  # Not a Python dependency: the binary the integration tests run (`lmp`).
  # nompi keeps the runtime free of MPI launch quirks on the CI runners;
  # every variant ships `lmp` with MANYBODY (eam/fs).
  - lammps =2025.07.22=*nompi*
  - pytest
  - pytest-cov
