# Exclusive caps for the release workflow. Every 0.x dependency needs one
# here, otherwise always-pin-unstable pins it to the exact patch version and
# the published wheel cannot be co-installed with its siblings. Everything
# not listed gets the next minor version as its cap (semantic-upper-bound:
# minor in release.yml), e.g. ase <3.30.0.
channels:
  - conda-forge

dependencies:
  - flowrep =0.7.0
  - lammpsparser =0.1.0
  # The suite passes on numpy 2.5.3 / scipy 1.18.1; the pin stays on the
  # newest 3.11-compatible numpy, so cap one minor above the newest tested
  # (pyiron_workflow_atomistics 0.3.0 itself requires numpy<2.6).
  - numpy =2.6.0
  - pymatgen =2027.0.0  # calendar-versioned; the default minor cap would be one month
  - pyiron_snippets =2.0.0
  - pyiron_workflow =0.21.0
  # 0.3.x only made atomistics' analysis deps optional; the engine API used
  # here is unchanged from 0.2.0.
  - pip:
      - pyiron_workflow_atomistics==0.4.0
